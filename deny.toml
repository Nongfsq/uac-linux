# cargo deny check: licenses, security advisories, crate sources.
# The root helper runs as root, so every new dependency must pass this.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail everywhere. "Unmaintained" notices fail only for direct
# dependencies: zvariant/zbus_names (via zbus) and basic-toml (a build-time
# macro) have no maintained replacement yet; recheck when ksni or i18n-embed
# moves on.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
