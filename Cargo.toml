[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Nongfsq/uac-linux"
publish = false

[workspace.dependencies]
uac-core = { path = "crates/uac-core" }
uac-i18n = { path = "crates/uac-i18n" }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
