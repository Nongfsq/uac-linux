name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Gate self-test
        run: bash scripts/check.sh --self-test
      - name: All checks
        run: bash scripts/check.sh

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Licenses and security advisories
        uses: EmbarkStudios/cargo-deny-action@v2
